syntax = "proto3";

package pinocchio.chatapp.v1;

option go_package = "github.com/go-go-golems/pinocchio/pkg/chatapp/pb/proto/pinocchio/chatapp/v1;chatappv1";

// ChatAttachment describes a user-provided attachment (currently images) by
// reference. Bytes never travel through the chat protocol: the hosting
// application stores them and exposes a URL that browsers can fetch.
message ChatAttachment {
  string attachment_id = 1;
  string kind = 2;
  string media_type = 3;
  string url = 4;
  uint64 size_bytes = 5;
  uint32 width = 6;
  uint32 height = 7;
  string filename = 8;
  string detail = 9;
  map<string, string> metadata = 10;
}

message StartInferenceCommand {
  string prompt = 1;
  string idempotency_key = 2;
  string request_id = 3;
  repeated ChatAttachment attachments = 4;
}

message StopInferenceCommand {}

message UsageInfo {
  int32 input_tokens = 1;
  int32 output_tokens = 2;
  int32 cached_tokens = 3;
  int32 cache_creation_input_tokens = 4;
  int32 cache_read_input_tokens = 5;
}

message CorrelationInfo {
  string session_id = 1;
  string run_id = 2;
  string turn_id = 4;
  string provider_call_id = 5;
  string segment_id = 15;
  string tool_call_id = 19;
}

message ChatRunStarted {
  string message_id = 1;
  string prompt = 2;
  CorrelationInfo correlation = 3;
  // ms since the epoch (server clock)
  int64 started_at_ms = 4;
  // the model the run uses (ComposedRuntime.Model), for display
  string model = 5;
}

message ChatRunFinished {
  string message_id = 1;
  string status = 2;
  string error = 3;
  optional int64 duration_ms = 4;
  CorrelationInfo correlation = 5;
  // truncated is true when the run hit its round limit and the model gave the
  // final answer with tools disabled (geppetto toolloop FinalAnswer).
  bool truncated = 6;
  // reason says why a truncated run ended, e.g. "max_rounds".
  string reason = 7;
  int64 finished_at_ms = 8;
}

message ChatRunStopped {
  string message_id = 1;
  string status = 2;
  string error = 3;
  CorrelationInfo correlation = 4;
  int64 finished_at_ms = 5;
}

message ChatRunFailed {
  string message_id = 1;
  string status = 2;
  string error = 3;
  CorrelationInfo correlation = 4;
  // code is a stable machine-readable failure class: max_rounds,
  // authentication_error, rate_limited, prompt_too_large, upstream_error, or a
  // code supplied by the caller's error (an error with a Code() string method).
  string code = 5;
  int64 finished_at_ms = 6;
}

message ChatProviderCallStarted {
  CorrelationInfo correlation = 1;
}

message ChatProviderCallMetadataUpdated {
  string stop_reason = 1;
  UsageInfo usage = 2;
  CorrelationInfo correlation = 3;
}

message ChatProviderCallFinished {
  string stop_reason = 1;
  string finish_class = 2;
  UsageInfo usage = 3;
  optional int64 duration_ms = 4;
  bool has_tool_calls = 5;
  CorrelationInfo correlation = 6;
  // the run (message id) the call belongs to
  string message_id = 7;
}

message ChatTextSegmentStarted {
  string message_id = 1;
  string role = 2;
  string prompt = 3;
  string status = 4;
  bool streaming = 5;
  CorrelationInfo correlation = 6;
  int64 at_ms = 7;
}

enum ChatStreamPatchMode {
  CHAT_STREAM_PATCH_MODE_UNSPECIFIED = 0;
  CHAT_STREAM_PATCH_MODE_APPEND = 1;
  CHAT_STREAM_PATCH_MODE_SNAPSHOT = 2;
  CHAT_STREAM_PATCH_MODE_REPLACE = 3;
}

message ChatTextPatch {
  string message_id = 1;
  string role = 2;
  string stream_id = 3;
  uint64 sequence = 4;
  uint64 offset = 5;
  string text = 6;
  ChatStreamPatchMode mode = 7;
  string status = 8;
  bool final = 9;
  string finish_reason = 10;
  string prompt = 11;
  CorrelationInfo correlation = 12;
  int64 at_ms = 13;
}

// ChatTextDelta is the compact, ephemeral UI representation of a
// ChatTextPatch. It is not a canonical backend event or timeline entity.
message ChatTextDelta {
  string message_id = 1;
  string text = 2;
  ChatStreamPatchMode mode = 3;
  bool final = 4;
}

message ChatTextSegmentFinished {
  string message_id = 1;
  string role = 2;
  string prompt = 3;
  string text = 4;
  string content = 5;
  string status = 6;
  bool streaming = 7;
  bool final = 8;
  string finish_reason = 9;
  CorrelationInfo correlation = 10;
  int64 at_ms = 11;
}

// ChatReasoningDelta is the compact, ephemeral UI representation of a
// ChatReasoningPatch. It is not a canonical backend event or timeline entity.
message ChatReasoningDelta {
  string message_id = 1;
  string parent_message_id = 2;
  string text = 3;
  ChatStreamPatchMode mode = 4;
  bool final = 5;
}

message ChatReasoningSegmentStarted {
  string message_id = 1;
  string parent_message_id = 2;
  string role = 3;
  string status = 4;
  bool streaming = 5;
  string source = 6;
  CorrelationInfo correlation = 7;
  int64 at_ms = 8;
}

message ChatReasoningPatch {
  string message_id = 1;
  string parent_message_id = 2;
  string role = 3;
  string stream_id = 4;
  uint64 sequence = 5;
  uint64 offset = 6;
  string text = 7;
  ChatStreamPatchMode mode = 8;
  string status = 9;
  bool final = 10;
  string source = 11;
  string finish_reason = 12;
  CorrelationInfo correlation = 13;
  int64 at_ms = 14;
}

message ChatReasoningSegmentFinished {
  string message_id = 1;
  string parent_message_id = 2;
  string role = 3;
  string text = 4;
  string content = 5;
  string status = 6;
  bool streaming = 7;
  string source = 8;
  string finish_reason = 9;
  CorrelationInfo correlation = 10;
  int64 at_ms = 11;
}

message ChatToolCallStarted {
  string message_id = 1;
  string tool_call_id = 2;
  string tool_name = 3;
  string input = 4;
  bool executing = 5;
  string status = 6;
  CorrelationInfo correlation = 7;
}

// ChatToolArgumentsDelta is the compact, ephemeral UI representation of a
// ChatToolArgumentsPatch. It is not a canonical backend event or timeline entity.
message ChatToolArgumentsDelta {
  string message_id = 1;
  string tool_call_id = 2;
  string tool_name = 3;
  string arguments = 4;
  ChatStreamPatchMode mode = 5;
  bool final = 6;
}

message ChatToolArgumentsPatch {
  string message_id = 1;
  string tool_call_id = 2;
  string tool_name = 3;
  string stream_id = 4;
  uint64 sequence = 5;
  uint64 offset = 6;
  string arguments = 7;
  ChatStreamPatchMode mode = 8;
  string status = 9;
  bool final = 10;
  CorrelationInfo correlation = 11;
}

message ChatToolCallRequested {
  string message_id = 1;
  string tool_call_id = 2;
  string tool_name = 3;
  string input = 4;
  bool executing = 5;
  string status = 6;
  CorrelationInfo correlation = 7;
}

message ChatToolExecutionStarted {
  string message_id = 1;
  string tool_call_id = 2;
  string tool_name = 3;
  string input = 4;
  bool executing = 5;
  string status = 6;
  CorrelationInfo correlation = 7;
  int64 at_ms = 8;
}

message ChatToolResultReady {
  string message_id = 1;
  string tool_call_id = 2;
  string tool_name = 3;
  string result = 4;
  string status = 5;
  CorrelationInfo correlation = 6;
  int64 at_ms = 7;
}

message ChatToolCallFinished {
  string message_id = 1;
  string tool_call_id = 2;
  string tool_name = 3;
  string status = 4;
  CorrelationInfo correlation = 5;
  int64 at_ms = 6;
}

// ChatToolCallProgress says what an executing tool call is doing: that it
// waits for a person ("awaiting-person", with that limit) or runs again
// ("running"). Published through toolexec's deadline middleware
// (toolexec.AwaitPerson).
message ChatToolCallProgress {
  string message_id = 1;
  string tool_call_id = 2;
  string state = 3;
  int64 limit_ms = 4;
  int64 at_ms = 5;
}

message ChatUserMessageAccepted {
  string message_id = 1;
  string role = 2;
  string prompt = 3;
  string text = 4;
  string content = 5;
  string status = 6;
  repeated ChatAttachment attachments = 7;
  // when the server accepted the message (ms since the epoch, server clock)
  int64 at_ms = 8;
}

// ChatRunEntity is a run's lifecycle in the timeline, so a snapshot holds
// every run's outcome (a client that missed the terminal event, or a run
// stopped before any output, is still visible). Its id is the run's message
// id.
message ChatRunEntity {
  string message_id = 1;
  // running, finished, failed or stopped
  string status = 2;
  string prompt = 3;
  // failed: ChatRunFailed.code; error: the failure's text
  string code = 4;
  string error = 5;
  // finished at the round limit with a final answer (ChatRunFinished)
  bool truncated = 6;
  string reason = 7;
  // the run's model (ChatRunStarted.model)
  string model = 8;
  // ms since the epoch (server clock); finished_at_ms is 0 while the run runs
  int64 started_at_ms = 9;
  int64 finished_at_ms = 10;
  // summed over the run's provider calls (ChatProviderCallFinished.message_id)
  UsageInfo usage = 11;
  int32 provider_calls = 12;
}

message ChatMessageEntity {
  string message_id = 1;
  string role = 2;
  string prompt = 3;
  string text = 4;
  string content = 5;
  string status = 6;
  bool streaming = 7;
  string error = 8;
  string parent_message_id = 9;
  int32 segment = 10;
  string segment_type = 11;
  bool final = 12;
  CorrelationInfo correlation = 13;
  repeated ChatAttachment attachments = 14;
  // ms since the epoch (server clock): the segment's first and last event; for a user message, when it was accepted
  int64 started_at_ms = 15;
  int64 finished_at_ms = 16;
}

message AgentModePreviewUpdate {
  string message_id = 1;
  string candidate_mode = 2;
  string analysis = 3;
  string parse_state = 4;
  bool preview = 5;
}

message AgentModeCommittedUpdate {
  string message_id = 1;
  string title = 2;
  string from = 3;
  string to = 4;
  string analysis = 5;
  bool preview = 6;
}

message AgentModePreviewCleared {
  string message_id = 1;
}

message AgentModeEntity {
  string message_id = 1;
  string title = 2;
  string from = 3;
  string to = 4;
  string analysis = 5;
  bool preview = 6;
}

message ToolCallEntity {
  string message_id = 1;
  string tool_call_id = 2;
  string tool_name = 3;
  string input = 4;
  bool executing = 5;
  string status = 6;
  CorrelationInfo correlation = 7;
  // ms since the epoch (server clock): execution start and end
  int64 started_at_ms = 8;
  int64 finished_at_ms = 9;
  // what the call is doing while it executes: "running" or "awaiting-person" (ChatToolCallProgress)
  string state = 10;
}

message ToolResultEntity {
  string message_id = 1;
  string tool_call_id = 2;
  string tool_name = 3;
  string result = 4;
  string status = 5;
  CorrelationInfo correlation = 6;
}
